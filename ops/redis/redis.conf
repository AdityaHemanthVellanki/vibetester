############################################
# AI Test Architect Redis Configuration
# Operational defaults for local dev and as a base for production.
# In production, bind to private networks and enable authentication/TLS.
############################################

bind 0.0.0.0
protected-mode no
port 6379
dir /data

appendonly yes
appendfsync everysec
save 900 1
save 300 10
save 60 10000

# maxmemory and eviction policy examples (tune for your workload)
# maxmemory 256mb
# maxmemory-policy allkeys-lru

# Authentication (enable in production)
# requirepass your-strong-password-here

timeout 0
tcp-keepalive 300
daemonize no
loglevel notice
always-show-logo no